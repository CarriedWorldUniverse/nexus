name: Runner images (CLI version rebuild)

# M1 Unit 7, Part C (PHASE2-DESIGN §7 "CLI version strategy"). Builds the
# builder/runner image (deploy/worker/Dockerfile) pinned to a specific
# @anthropic-ai/claude-code release, multi-arch (amd64 + arm64 — robo-dog is
# arm64), tags it runner:cli-<ver>, and pre-loads it onto every cluster node's
# containerd so dispatch Jobs can keep imagePullPolicy: Never (see
# .github/workflows/README-runner-images.md for the full PullNever
# node-distribution rationale + the §7 knob + §6 auth-source docs).
#
# This workflow is a DOCUMENTED DELIVERABLE (§7 build spec Part C says "it
# doesn't need to run") — it is NOT wired to real secrets/hosts in this repo
# state. Before enabling: set the repo secrets listed under "Required
# secrets" below and confirm GHCR + node SSH access.

on:
  workflow_dispatch:
    inputs:
      claude_code_version:
        description: 'npm dist-tag or exact version of @anthropic-ai/claude-code to bake in (e.g. "2.1.3" or "latest")'
        required: true
        default: 'latest'
      distribute:
    name: pre-load onto cluster nodes (PullNever)
    needs: [resolve-version, build-push]
    if: ${{ github.event.inputs.distribute != 'false' }}
    runs-on: ubuntu-latest
    # Secrets are mapped to env so the steps below can be gated on their
    # presence: with none of them set this leg prints a notice and skips, so a
    # scheduled rebuild never fails on distribution config.
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: dmon
            arch: amd64
            host_secret: DMON_SSH_HOST
          - node: robo-dog
            arch: arm64
            host_secret: ROBODOG_SSH_HOST
    steps:
      # PullNever means the pod spec never asks containerd to reach a registry
      # at dispatch time (sovereignty: no runtime dependency on GHCR) — so
      # distribution means pre-loading the image into each node's k3s
      # containerd, once, from CI. The nodes are reachable only inside the
      # tailnet, so the runner joins it ephemerally first.
      - name: join the tailnet (ephemeral)
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      # The deploy key is restricted on each node to ONE forced command,
      # /usr/local/bin/nexus-image-distribute (source: deploy/node/), which
      # validates the version, reads the GHCR token from stdin (never argv),
      # pulls the tag for the node's own arch and re-tags it
      # localhost/nexus-runner:cli-<ver> and :latest. Host keys are pinned.
      - name: distribute ${{ matrix.node }} (${{ matrix.arch }})
        env:
          SSH_HOST: ${{ secrets[matrix.host_secret] }}
          SSH_KEY: ${{ secrets.NODE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.NODE_SSH_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TS_OAUTH_CLIENT_ID}" ] || [ -z "${SSH_HOST}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::notice::${{ matrix.node }}: tailnet/SSH secrets unset — skipping live distribution (README-runner-images.md, Enabling this for real)."
            exit 0
          fi
          umask 077; mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/id_ed25519
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          printf '%s' "${GHCR_TOKEN}" | ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/id_ed25519 "jacinta@${SSH_HOST}" "${VER}"
